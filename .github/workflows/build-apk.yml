name: Build Android APK

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Check if Gradle project exists
      id: check-gradle
      run: |
        if [ -f "gradlew" ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "⚠️ No Gradle project found. Skipping APK build."
        fi
      
    - name: Set up JDK 17 (with Gradle cache)
      if: steps.check-gradle.outputs.exists == 'true'
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Set up JDK 17 (without cache)
      if: steps.check-gradle.outputs.exists == 'false'
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
      
    - name: Grant execute permission for gradlew
      if: steps.check-gradle.outputs.exists == 'true'
      run: chmod +x gradlew
      
    - name: Build debug APK
      if: steps.check-gradle.outputs.exists == 'true'
      run: ./gradlew assembleDebug --stacktrace
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: steps.check-gradle.outputs.exists == 'true'
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
        
    - name: Comment APK download link on PR
      uses: actions/github-script@v7
      if: github.event_name == 'pull_request' && steps.check-gradle.outputs.exists == 'true'
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '✅ APK built successfully! Download it from the artifacts section above. 📦'
          });
